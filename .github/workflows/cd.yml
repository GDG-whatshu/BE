name: Spring Boot CD

# 언제 실행할 것인가? (dev 브랜치에 코드가 머지될 때)
on:
  push:
    branches: [ "dev" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 내 코드 가져오기
        uses: actions/checkout@v6

      - name: 2. 자바 21 환경 세팅하기
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: 3. 프로젝트 빌드 (테스트는 CI에서 했으니 생략)
        run: |
          chmod +x gradlew
          ./gradlew clean build -x test

      - name: 4. 빌드된 파일을 EC2로 전송 (SCP)
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_KEY }}
          source: "BE/build/libs/*SNAPSHOT.jar"
          target: "/home/ubuntu/BE/build/libs"
          strip_components: 3

      - name: 5. EC2에 접속해서 기존 서버 끄고 새 서버 켜기 (SSH)
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            cd /home/ubuntu/BE/build/libs
            
            echo "1. 현재 실행 중인 서버 확인 및 종료"
            CURRENT_PID=$(pgrep -f .jar)
            if [ -z "$CURRENT_PID" ]; then
              echo "현재 실행 중인 서버가 없습니다."
            else
              echo "실행 중인 서버(PID: $CURRENT_PID)를 종료합니다."
              kill -15 $CURRENT_PID
              sleep 10
            fi
            
            echo "2. 새로운 서버 실행"
            # nohup을 사용해 백그라운드에서 실행하고, 로그는 application.log에 남깁니다.
            nohup java -jar *.jar > application.log 2>&1 &
            echo "배포가 성공적으로 완료되었습니다!"