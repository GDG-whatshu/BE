name: Spring Boot CI

on:
  pull_request:
    branches: [ "dev" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 내 코드 가져오기 (Checkout)
        uses: actions/checkout@v6

      - name: 2. 자바 21 환경 세팅
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: 3. gradlew 파일에 실행 권한 주기
        run: |
          chmod +x gradlew

      - name: 4. 프로젝트 빌드 및 테스트 실행
        run: |
          ./gradlew build